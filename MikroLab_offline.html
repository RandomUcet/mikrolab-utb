 nich budoucí výnos.","level":2}],"deepDive":{"title":"Investice, úrok a časová hodnota peněz","lead":"Kapitál je výrobní vstup a finanční prostředky lze použít na různé investice. Proto porovnáváme očekávaný budoucí přínos s dnešní cenou financování.","steps":["Úrok je cenou zapůjčeného kapitálu; vyšší úrok zvyšuje náklady financování.","Při investici porovnej současnou hodnotu očekávaných příjmů s nákladem.","Diskontování převádí budoucí platbu na dnešní hodnotu.","Firma by neměla investovat pouze podle nominálního zisku bez zohlednění času a rizika."],"formula":"PV = FV / (1 + r)^n, kde r je sazba za období a n počet období.","challenge":"Za rok získáš 11 000 Kč. Při diskontní sazbě 10 % ročně, jaká je současná hodnota?","solution":"PV = 11 000 / 1,10 = 10 000 Kč. Dnes bys při dané sazbě měl být ochoten zaplatit přibližně nejvýše tuto částku, pokud odhlédneme od rizika."}},{"id":"rovnovaha","order":12,"title":"Celková rovnováha a efektivnost","blurb":"Vazby trhů, Walrasova rovnováha a Paretova efektivnost.","minutes":15,"objectives":["Rozlišit dílčí a celkovou rovnováhu.","Popsat Paretovo zlepšení.","Vysvětlit propojenost trhů."],"sections":[{"heading":"Parciální a celková rovnováha","body":"Parciální analýza zkoumá jeden trh při ostatních nezměněných podmínkách. Celková rovnováha sleduje propojené trhy současně: změna na jednom může působit na další."},{"heading":"Walrasovský přístup","body":"V modelu celkové rovnováhy se ceny přizpůsobují tak, aby se na trzích vyrovnávala nabídka a poptávka při vzájemných vazbách."},{"heading":"Paretovská efektivnost","body":"Alokace je Paretovsky efektivní, pokud nelze někomu polepšit bez zhoršení situace jiného. Efektivnost sama o sobě neříká, zda je rozdělení spravedlivé."}],"example":{"title":"Zdražení elektřiny","situation":"Energie zdraží pro domácnosti i továrny.","reasoning":"Rostou výrobní náklady, což ovlivní nabídku výrobků, zaměstnanost i spotřebitelské rozpočty.","conclusion":"Jeden cenový šok může zasáhnout více vzájemně provázaných trhů."},"pitfall":"Paretova efektivnost a rovnost rozdělení nejsou synonyma.","source":"Sýkora: Celková rovnováha a tržní efektivnost, seminář č. 12; Dohnalová a Dobeš: Mikroekonomie I (2013), kap. 11.","cards":[{"id":"rovnovaha-c1","front":"Parciální rovnováha?","back":"Analýza jednoho trhu při ostatních podmínkách neměnných."},{"id":"rovnovaha-c2","front":"Celková rovnováha?","back":"Současné vyrovnání vzájemně propojených trhů."},{"id":"rovnovaha-c3","front":"Paretovo zlepšení?","back":"Zlepšení situace alespoň jednoho bez zhoršení kohokoliv jiného."},{"id":"rovnovaha-c4","front":"Je Pareto efektivnost totéž co spravedlnost?","back":"Ne, efektivní rozdělení může být velmi nerovné."},{"id":"rovnovaha-x-c1","front":"Co je Paretovo zlepšení?","back":"Změna, která někomu prospěje a nikomu jinému neublíží."},{"id":"rovnovaha-x-c2","front":"Zaručuje Paretova efektivnost spravedlnost?","back":"Ne. Efektivnost a spravedlivé rozdělení jsou odlišné otázky."}],"questions":[{"stem":"Co je hlavní rozdíl mezi parciální a celkovou rovnováhou?","options":["Parciální řeší jediný trh, celková vazby více trhů","Celková ignoruje trhy","Parciální zahrnuje všechny země","Neexistuje rozdíl"],"answer":0,"explanation":"Celková analýza respektuje vzájemnou provázanost trhů.","level":1,"id":"rovnovaha-q1"},{"stem":"Kdy je alokace Paretovsky efektivní?","options":["Když mají všichni stejné příjmy","Když nelze nikomu polepšit bez zhoršení jiného","Když je maximální daň","Když je nulová nezaměstnanost"],"answer":1,"explanation":"Definice Paretovy efektivnosti se týká možnosti nezhoršujícího zlepšení.","level":1,"id":"rovnovaha-q2"},{"stem":"Jaký je příklad vzájemné provázanosti trhů?","options":["Dražší energie mění výrobní náklady a ceny produktů","Cena energie neovlivní žádný další trh","Výrobní náklady jsou nezávislé na energiích","Spotřebitelé nemají rozpočet"],"answer":0,"explanation":"Změny cen vstupů se promítají do produkce a dalších trhů.","level":1,"id":"rovnovaha-q3"},{"stem":"Je Paretovsky efektivní alokace automaticky sociálně spravedlivá?","options":["Ano, vždy","Ne, efektivnost a spravedlnost jsou odlišné pojmy","Jen pokud neexistují ceny","Jen při nulovém HDP"],"answer":1,"explanation":"Paretovo kritérium neposuzuje, zda je rozdělení příjmů férové.","level":1,"id":"rovnovaha-q4"},{"stem":"Co charakterizuje celkovou rovnováhu v základním modelu?","options":["Ceny a množství se současně přizpůsobují napříč trhy","Každý trh je izolovaný","Neexistují výrobní faktory","Poptávka se nemůže změnit"],"answer":0,"explanation":"Ceny koordinují chování subjektů napříč více trhy.","level":1,"id":"rovnovaha-q5"},{"stem":"Paretovo zlepšení nastane, pokud…","options":["Někdo získá a nikdo jiný neztratí","Všichni mají identickou mzdu","Stát zvýší daň","Všechny firmy maximalizují tržby"],"answer":0,"explanation":"Jde o zlepšení alespoň jednoho bez újmy ostatních.","level":1,"id":"rovnovaha-q6"},{"id":"rovnovaha-x-q1","stem":"Co je Paretovo zlepšení?","options":["Změna zlepšující alespoň jednoho bez poškození jiných","Zvýšení příjmu jednoho na úkor druhého","Stav s rovnými mzdami pro všechny","Každé zvýšení HDP"],"answer":0,"explanation":"Nikomu se nesmí pohoršit a alespoň jednomu se musí polepšit.","level":2},{"id":"rovnovaha-x-q2","stem":"Je každé paretovsky efektivní rozdělení automaticky spravedlivé?","options":["Ano, podle definice","Ne, efektivnost neřeší spravedlnost","Ano, pokud existují daně","Ne, protože nemá žádné ceny"],"answer":1,"explanation":"Efektivnost nevylučuje velkou nerovnost v rozdělení.","level":2},{"id":"rovnovaha-x-q3","stem":"Rostoucí cena elektřiny zasáhne výrobní náklady více odvětví. Jakou ekonomickou souvislost to ukazuje?","options":["Vzájemnou propojenost trhů","Nemožnost obchodu mezi firmami","Existenci jediného produktu","Neměnnost všech tržních cen"],"answer":0,"explanation":"Ceny vstupů na jednom trhu se přenášejí do nabídky na dalších trzích.","level":2}],"deepDive":{"title":"Trhy jsou navzájem propojené","lead":"Změna jednoho trhu může zasáhnout další. Proto je někdy potřeba místo jediného grafu nabídky a poptávky uvažovat více trhů zároveň.","steps":["Při zdražení energie se mění náklady výroby a nabídka navazujících firem.","Změny cen vstupů ovlivní zisk, zaměstnanost a následně příjmy domácností.","Paretovo zlepšení znamená, že si někdo polepší, aniž si jiný pohorší.","Paretovská efektivnost sama o sobě neznamená spravedlivé rozdělení příjmů."],"formula":"Paretovo zlepšení: alespoň jeden je na tom lépe a nikdo hůře.","challenge":"Dva lidé mají nerovně rozdělené zdroje a nelze nikomu přidat bez ubrání druhému. Je rozdělení nutně spravedlivé?","solution":"Ne. Může být paretovsky efektivní a současně velmi nerovné."}},{"id":"trzni-selhani","order":13,"title":"Tržní selhání a stát","blurb":"Externality, veřejné statky, informační asymetrie a důvody regulace.","minutes":15,"objectives":["Rozpoznat čtyři příčiny tržního selhání.","Vysvětlit pozitivní a negativní externalitu.","Popsat nástroje nápravy i jejich limity."],"sections":[{"heading":"Tržní selhání","body":"Tržní mechanismus někdy nevede ke společensky efektivní alokaci. Může jít o tržní sílu, externality, veřejné statky nebo asymetrické informace."},{"heading":"Externality a veřejné statky","body":"Negativní externalita znamená, že činnost škodí třetím osobám bez odpovídající náhrady, například znečištění. Pozitivní externalita přináší přínos ostatním, například vzdělání. Čistě veřejný statek je nevylučitelný a nerivalitní."},{"heading":"Role státu a limity","body":"Daně, dotace, regulace či veřejné poskytování statků mohou řešit selhání. Zásahy však mají náklady a mohou samy vytvářet neefektivnosti; je třeba srovnat přínos a náklady."}],"example":{"title":"Továrna a ovzduší","situation":"Továrna vypouští emise, které zhoršují zdraví místních obyvatel.","reasoning":"Firma ve svých soukromých nákladech nezohlední veškeré společenské škody.","conclusion":"Emisní poplatky nebo jiná opatření mohou vnést vnější náklady do rozhodování firmy."},"pitfall":"Veřejný statek není totéž co „cokoliv, co vlastní stát“. Rozhodující jsou ekonomické vlastnosti spotřeby.","source":"Sýkora: Tržní selhání a působení státu, seminář č. 13; Dohnalová a Dobeš: Mikroekonomie I (2013).","cards":[{"id":"trzni-selhani-c1","front":"Co je negativní externalita?","back":"Náklad uvalený na třetí osoby bez odpovídající kompenzace."},{"id":"trzni-selhani-c2","front":"Co je veřejný statek?","back":"Statkem v čisté podobě nevylučitelným a nerivalitním."},{"id":"trzni-selhani-c3","front":"Asymetrické informace?","back":"Jedna strana transakce má relevantně více informací než druhá."},{"id":"trzni-selhani-c4","front":"Jak lze korigovat externalitu?","back":"Například daní, dotací nebo regulací podle povahy externality."},{"id":"trzni-selhani-x-c1","front":"Co je negativní externalita?","back":"Náklad činnosti dopadající na jiné osoby, který není plně zahrnut v tržní ceně."},{"id":"trzni-selhani-x-c2","front":"Co je asymetrická informace?","back":"Jedna strana transakce ví o relevantní kvalitě či riziku více než druhá."}],"questions":[{"stem":"Co je příkladem negativní externality?","options":["Vzdělávání s přínosy pro společnost","Kouř z továrny škodící sousedům","Dobrovolná sleva v obchodě","Růst produktivity firmy"],"answer":1,"explanation":"Škoda dopadá na třetí osoby a tržní cena ji nemusí zohlednit.","level":1,"id":"trzni-selhani-q1"},{"stem":"Který příklad nejlépe odpovídá čistému veřejnému statku?","options":["Soukromý mobil","Krajíc chleba","Národní obrana","Jedno sedadlo v kině"],"answer":2,"explanation":"Národní obrana je obvykle nerivalitní a nelze z ní snadno vyloučit jednotlivce.","level":1,"id":"trzni-selhani-q2"},{"stem":"Co znamená informační asymetrie?","options":["Obě strany znají přesně totéž","Jedna strana ví o podstatné vlastnosti více než druhá","Cena výrobku je pevná","Poptávka rovná se nabídka"],"answer":1,"explanation":"Nerovnoměrné informace mohou narušit kvalitu rozhodování.","level":1,"id":"trzni-selhani-q3"},{"stem":"Jaký nástroj může pomoci řešit negativní externalitu z emisí?","options":["Emisní daň","Dotace za další znečištění","Zákaz jakékoliv informace","Odstranění evidence emisí"],"answer":0,"explanation":"Daň z externality může promítnout část společenských nákladů do ceny.","level":1,"id":"trzni-selhani-q4"},{"stem":"Pozitivní externalitou vzdělání může být…","options":["Vyšší prospěch společnosti díky znalostem","Povinný růst emisí","Zhoršení informačních toků","Snížení lidského kapitálu"],"answer":0,"explanation":"Vzdělání má vedle soukromých i společenské přínosy.","level":1,"id":"trzni-selhani-q5"},{"stem":"Proč ani státní zásah není automaticky optimální?","options":["Regulace nemá žádné náklady","Existují informační omezení a náklady regulace","Stát nikdy nemůže vybírat daně","Veřejné statky nejsou dostupné"],"answer":1,"explanation":"Vedle tržního selhání existuje i riziko neefektivní politiky.","level":2,"id":"trzni-selhani-q6"},{"id":"trzni-selhani-x-q1","stem":"Automobilová doprava vytváří hluk pro obyvatele okolí bez kompenzace. Co jde za příklad?","options":["Pozitivní externality","Negativní externality","Dokonalé informovanosti","Veřejného zisku"],"answer":1,"explanation":"Hluk představuje externí náklad pro třetí osoby.","level":2},{"id":"trzni-selhani-x-q2","stem":"Která dvojice vlastností charakterizuje čistý veřejný statek?","options":["Rivalita a vylučitelnost","Nerivalita a nevylučitelnost","Rivalita a volný vstup","Zisk a monopol"],"answer":1,"explanation":"Spotřeba jednoho neomezuje druhého a vyloučení je obtížné nebo nemožné.","level":2},{"id":"trzni-selhani-x-q3","stem":"Kupující o stavu ojetého auta ví méně než prodávající. Jaký tržní problém řeší?","options":["Asymetrii informací","Náklady obětované příležitosti","Mezní produkt","Tržní rovnováhu bez nejistoty"],"answer":0,"explanation":"Prodávající má relevantní informace, které kupující nemusí mít.","level":2}],"deepDive":{"title":"Proč trh někdy nedosahuje společensky vhodného výsledku","lead":"Tržní cena nezachytí všechny dopady výroby a spotřeby. Když například firma způsobuje hluk okolí, část nákladů nese někdo jiný.","steps":["Externalita vzniká, když činnost ovlivní nezúčastněné osoby bez plné kompenzace v cenách.","Veřejný statek je zpravidla nerivalitní a nevylučitelný ze spotřeby.","Asymetrické informace mohou vést ke špatnému výběru nebo nedostatečné důvěře.","Státní zásah může problémy omezit, ale má i administrativní náklady a riziko vlastního selhání."],"formula":"Při negativní externalitě: společenské mezní náklady = soukromé mezní náklady + externí mezní škody.","challenge":"Továrna vypouští emise, jejichž náklady na zdraví lidí se nepromítají do ceny produktu. Jaký problém vzniká?","solution":"Negativní produkční externalita; tržní cena nezachycuje všechny společenské náklady."}},{"id":"ai-trh-prace","order":14,"title":"AI a budoucnost trhu práce","blurb":"Aplikace mikroekonomie: automatizace, augmentace, pracovní místa a česká data.","minutes":15,"objectives":["Odlišit pracovní úkol od celé profese.","Rozlišit skutečný údaj, očekávání firem a prognózu.","Posoudit substituci a doplnění lidské práce."],"sections":[{"heading":"Dvě cesty změny","body":"Automatizace nahrazuje konkrétní úkoly, například třídění faktur. Augmentace pomáhá pracovníkovi zvýšit výkon, například při analýze dat. Dopad na zaměstnanost není automaticky totožný s dopadem na jednotlivé činnosti."},{"heading":"České scénáře a časové horizonty","body":"Studie BCG, MPSV a Aspen z roku 2025 modeluje do roku 2035 vznik 955 tisíc míst a zánik 355 tisíc; změny zahrnují více trendů, nejen AI. Průzkum ÚP ČR 2026 zjistil, že 61 % dotázaných zaměstnavatelů nečeká během dalších tří let významnou změnu počtu zaměstnanců kvůli AI."},{"heading":"Dovednosti","body":"V průzkumu ÚP ČR 2026 byly za důležité pro budoucnost nejčastěji označeny technické dovednosti (58 %), digitální gramotnost (50 %) a kreativní myšlení (47 %). Jde o odpovědi zaměstnavatelů, nikoliv naměřené dopady AI."}],"example":{"title":"Účetní oddělení","situation":"AI přečte příchozí faktury a navrhne jejich zaúčtování.","reasoning":"Člověk může kontrolovat chyby, řešit výjimky a věnovat se klientům. Firma také může potřebovat méně hodin rutinní práce.","conclusion":"Proměna náplně práce a zánik pracovního místa jsou odlišné události."},"pitfall":"Neříkej, že „AI zruší 43 % míst“. BCG v daném údaji popisuje podíl profesí ovlivněných GenAI, ne podíl zaniklých míst.","source":"BCG, MPSV, Aspen Institute: Budoucnost českého pracovního trhu (2025), s. 20–21; Úřad práce ČR: Predikce a realita pracovního trhu očima zaměstnavatelů (2026), s. 25–29.","cards":[{"id":"ai-trh-prace-c1","front":"Automatizace práce?","back":"Technologie přebírá některé úkoly, které dříve dělal člověk."},{"id":"ai-trh-prace-c2","front":"Augmentace práce?","back":"Technologie podporuje lidskou práci a zvyšuje schopnost plnit úkoly."},{"id":"ai-trh-prace-c3","front":"Kolik firem nečekalo významnou změnu počtu lidí kvůli AI?","back":"61 % v šetření ÚP ČR 2026, v horizontu tří let."},{"id":"ai-trh-prace-c4","front":"Prognóza BCG do 2035: vznik / zánik?","back":"955 tisíc nových a 355 tisíc zaniklých pozic podle modelu."},{"id":"ai-trh-prace-c5","front":"Co je rekvalifikace?","back":"Osvojení kompetencí pro jiné pracovní uplatnění."},{"id":"ai-trh-prace-x-c1","front":"Co znamená vystavení profese generativní AI?","back":"Část jejích pracovních úkolů může být technologií ovlivněna; nemusí jít o zánik místa."},{"id":"ai-trh-prace-x-c2","front":"Proč nelze srovnávat čísla BCG 2035 a ÚP 2026 jako stejný ukazatel?","back":"Jde o jiný horizont i veličinu: zásah do úkolů versus očekávanou změnu počtu pracovníků."}],"questions":[{"stem":"Když chatbot převezme rutinní dotazy zákaznické podpory, jde primárně o…","options":["Substituci části lidské práce","Růst nabídky domácností","Snížení důchodového efektu","Vznik veřejného statku"],"answer":0,"explanation":"Technologie přebírá konkrétní pracovní činnost.","level":1,"id":"ai-trh-prace-q1"},{"stem":"Když AI pomáhá specialistovi zpracovat více zakázek, jde především o…","options":["Monopson","Augmentaci","Důchodový efekt","Cenový strop"],"answer":1,"explanation":"AI doplňuje člověka a podporuje jeho produktivitu.","level":1,"id":"ai-trh-prace-q2"},{"stem":"Co znamená, že pracovní místo je „ovlivněno GenAI“?","options":["Pracovní místo určitě zanikne","Všechny úkoly se zautomatizují","Některé činnosti se mohou změnit","Mzda musí být nulová"],"answer":2,"explanation":"Expozice GenAI a zánik celé pozice nejsou totéž.","level":1,"id":"ai-trh-prace-q3"},{"stem":"Kolik zaměstnavatelů v šetření ÚP ČR 2026 neočekávalo významnou změnu počtu zaměstnanců kvůli AI během tří let?","options":["29 %","4 %","61 %","95 %"],"answer":2,"explanation":"ÚP ČR uvádí 61 % respondentů, kteří nečekají významnou změnu.","level":1,"id":"ai-trh-prace-q4"},{"stem":"Jaký čistý přírůstek pracovních míst plyne z prognózy 955 tisíc nových a 355 tisíc zanikajících pozic?","options":["600 tisíc","355 tisíc","1 310 tisíc","955 tisíc"],"answer":0,"explanation":"955 − 355 = 600 tisíc. Výhled zahrnuje více trendů než pouze AI.","level":2,"id":"ai-trh-prace-q5"},{"stem":"Které dovednosti označili zaměstnavatelé v ÚP ČR 2026 nejčastěji jako důležité?","options":["Pouze cizí jazyky","Technické dovednosti","Pouze manažerské dovednosti","Jen práce v kanceláři"],"answer":1,"explanation":"Technické dovednosti uvedlo 58 % zaměstnavatelů, nejvíce z nabídnutých možností.","level":1,"id":"ai-trh-prace-q6"},{"id":"ai-trh-prace-x-q1","stem":"Podle šetření ÚP ČR 2026 většina dotázaných firem v horizontu tří let kvůli AI…","options":["Očekává zdvojnásobení počtu zaměstnanců","Nepředpokládá výraznou změnu počtu zaměstnanců","Očekává zánik všech administrativních míst","Nemá žádné zaměstnance"],"answer":1,"explanation":"Přibližně 61 % nečekalo významnou změnu počtu zaměstnanců; jde o očekávání.","level":2},{"id":"ai-trh-prace-x-q2","stem":"Co je přík const CALC_SKILLS = [
    { id: 'rovnovaha-trhu', topicId: 'trzni-mechanismus', title: 'Tržní rovnováha', summary: 'Rovnovážná cena z lineárních funkcí poptávky a nabídky.', formula: 'Qd = a − bP, Qs = c + dP; v rovnováze Qd = Qs', level: 2 },
    { id: 'elasticita', topicId: 'spotrebitel', title: 'Cenová elasticita poptávky', summary: 'Bodová elasticita jednoduché lineární poptávky.', formula: '|Ed| = |(dQ/dP) × (P/Q)|', level: 3 },
    { id: 'trzba', topicId: 'firma', title: 'Celková tržba', summary: 'Výpočet příjmů firmy z ceny a prodaného množství.', formula: 'TR = P × Q', level: 1 },
    { id: 'prumerne-naklady', topicId: 'firma', title: 'Průměrné náklady', summary: 'Rozdělení fixních a variabilních nákladů na jednotku.', formula: 'AC = (FC + VC) / Q', level: 2 },
    { id: 'mezni-naklady', topicId: 'firma', title: 'Mezní náklady', summary: 'Změna celkových nákladů při zvýšení produkce.', formula: 'MC = ΔTC / ΔQ', level: 2 },
    { id: 'zisk', topicId: 'dokonala-konkurence', title: 'Ekonomický zisk (model)', summary: 'Rozdíl tržeb a všech zadaných nákladů firmy.', formula: 'π = TR − TC', level: 1 },
    { id: 'mezni-produkt', topicId: 'vyrobni-faktory', title: 'Mezní produkt práce', summary: 'O kolik vzroste výstup při přidání jednotky práce.', formula: 'MPL = ΔQ / ΔL', level: 2 },
    { id: 'trh-prace', topicId: 'trh-prace', title: 'Přínos dodatečného pracovníka', summary: 'Mezní příjem produktu práce a mzdový náklad.', formula: 'MRPL = MPL × P (při konstantní ceně produkce)', level: 2 },
    { id: 'monopol', topicId: 'monopol', title: 'Monopol s konstantními MC', summary: 'Zisk maximalizující produkce při lineární poptávce.', formula: 'P = a − bQ, MR = a − 2bQ, optimum MR = MC', level: 3 },
    { id: 'mezni-uzitek', topicId: 'spotrebitel', title: 'Mezní užitek', summary: 'Rozdíl celkového užitku při další spotřebované jednotce.', formula: 'MU = ΔTU / ΔQ', level: 1 },
    { id: 'soucasna-hodnota', topicId: 'kapital', title: 'Současná hodnota', summary: 'Kolik dnes odpovídá budoucímu příjmu při dané úrokové míře.', formula: 'PV = FV / (1 + r)^n', level: 3 },
    { id: 'bod-zvratu', topicId: 'firma', title: 'Bod zvratu', summary: 'Minimální objem produkce, při kterém jsou tržby rovny nákladům.', formula: 'Q* = FC / (P − AVC)', level: 2 }
];
const byId = new Map(CALC_SKILLS.map(skill => [skill.id, skill]));
const rr = (rng, min, max) => min + Math.floor(Math.min(0.999999, Math.max(0, rng())) * (max - min + 1));
const cz = (x) => Number.isInteger(x) ? String(x) : String(x).replace('.', ',');
const round2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
/** Seeded PRNG for reproducible problems in tests and for future remote sync. */
function seededRandom(seed) {
    let n = seed | 0;
    return () => { n = (n + 0x6d2b79f5) | 0; let t = Math.imul(n ^ (n >>> 15), 1 | n); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function generateCalcProblem(skillId, rng = Math.random) {
    const skill = byId.get(skillId);
    if (!skill)
        throw new Error(`Neznámá dovednost: ${skillId}`);
    const val = (min, max) => rr(rng, min, max);
    let prompt = '', answer = 0, steps = [], hint = '', unit = '';
    let market;
    let labor;
    switch (skillId) {
        case 'rovnovaha-trhu': {
            const price = val(8, 35), q = val(30, 120), b = val(2, 5), d = val(2, 5);
            const a = q + b * price, c = q - d * price;
            market = { a, b, c, d };
            prompt = `Poptávka je Qd = ${a} − ${b}P a nabídka Qs = ${c} + ${d}P. Urči rovnovážnou cenu P.`;
            answer = price;
            unit = 'Kč';
            hint = 'Polož Qd = Qs a převeď členy s cenou na stejnou stranu.';
            steps = [`Rovnováha nastane, když Qd = Qs: ${a} − ${b}P = ${c} + ${d}P.`, `Převedeme členy: ${a - c} = ${b + d}P.`, `P = (${a - c}) / (${b + d}) = ${price} Kč.`];
            break;
        }
        case 'elasticita': {
            const b = val(2, 5), price = val(5, 25), q = val(12, 75), a = q + b * price;
            prompt = `Poptávka má tvar Q = ${a} − ${b}P. Při ceně P = ${price} je poptávané množství Q = ${q}. Urči absolutní hodnotu bodové cenové elasticity |Ed| (na 2 desetinná místa).`;
            answer = round2(b * price / q);
            unit = 'bez jednotky';
            hint = 'U lineární poptávky je směrnice dQ/dP konstantní. Vypočítej absolutní hodnotu jejího součinu s poměrem P/Q.';
            steps = [`Směrnice poptávky dQ/dP = −${b}.`, `|Ed| = ${b} × ${price} / ${q}.`, `|Ed| = ${cz(answer)} (zaokrouhleno na dvě desetinná místa).`];
            break;
        }
        case 'trzba': {
            const price = val(5, 60) * 10, qty = val(8, 80);
            prompt = `Firma prodala ${qty} výrobků za cenu ${price} Kč za kus. Jaká je její celková tržba?`;
            answer = price * qty;
            unit = 'Kč';
            hint = 'Tržba představuje cenu každého prodaného kusu vynásobenou jejich počtem.';
            steps = [`TR = P × Q.`, `TR = ${price} × ${qty} = ${answer} Kč.`];
            break;
        }
        case 'prumerne-naklady': {
            const qty = val(4, 20) * 10, ac = val(10, 55), fc = val(1, 6) * qty;
            const vc = qty * ac - fc;
            prompt = `Firma vyrábí ${qty} kusů. Fixní náklady jsou ${fc} Kč, celkové variabilní náklady ${vc} Kč. Jaké jsou průměrné celkové náklady AC na jeden kus?`;
            answer = ac;
            unit = 'Kč/kus';
            hint = 'Nejdříve sečti fixní a celkové variabilní náklady, potom je vyděl množstvím.';
            steps = [`TC = FC + VC = ${fc} + ${vc} = ${fc + vc} Kč.`, `AC = TC / Q = ${fc + vc} / ${qty} = ${ac} Kč/kus.`];
            break;
        }
        case 'mezni-naklady': {
            const q0 = val(10, 65), dq = val(1, 5), tc0 = val(80, 300) * 10, mc = val(8, 70), tc1 = tc0 + mc * dq;
            prompt = `Při produkci ${q0} kusů jsou celkové náklady ${tc0} Kč. Při ${q0 + dq} kusech jsou ${tc1} Kč. Vypočti mezní náklady na jeden dodatečný kus v tomto intervalu.`;
            answer = mc;
            unit = 'Kč/kus';
            hint = 'Porovnej přírůstek celkových nákladů s přírůstkem množství.';
            steps = [`ΔTC = ${tc1} − ${tc0} = ${tc1 - tc0} Kč.`, `ΔQ = ${q0 + dq} − ${q0} = ${dq} kusů.`, `MC = ΔTC / ΔQ = ${tc1 - tc0} / ${dq} = ${mc} Kč/kus.`];
            break;
        }
        case 'zisk': {
            const qty = val(10, 70), p = val(30, 90), v = val(12, p - 5), fc = val(1, 15) * 10;
            prompt = `Firma prodá ${qty} kusů za ${p} Kč/kus. Variabilní náklady na kus jsou ${v} Kč a celkové fixní náklady ${fc} Kč. Předpokládej, že jde o všechny relevantní náklady. Vypočti zisk.`;
            answer = (p - v) * qty - fc;
            unit = 'Kč';
            hint = 'Od celkových tržeb odečti variabilní náklady všech výrobků i fixní náklady.';
            steps = [`TR = ${p} × ${qty} = ${p * qty} Kč.`, `TC = ${v} × ${qty} + ${fc} = ${v * qty + fc} Kč.`, `π = TR − TC = ${p * qty} − ${v * qty + fc} = ${answer} Kč.`];
            break;
        }
        case 'mezni-produkt': {
            const labor = val(2, 15), dl = val(1, 4), q0 = val(10, 80), mp = val(4, 35), q1 = q0 + dl * mp;
            prompt = `Firma zvýší počet pracovníků z ${labor} na ${labor + dl}. Produkce vzroste z ${q0} na ${q1} kusů. Jaký je průměrný mezní produkt práce v tomto intervalu?`;
            answer = mp;
            unit = 'kusů/pracovníka';
            hint = 'Urči dodatečný výstup a vyděl jej přírůstkem počtu pracovníků.';
            steps = [`ΔQ = ${q1} − ${q0} = ${q1 - q0} kusů.`, `ΔL = ${labor + dl} − ${labor} = ${dl} pracovníků.`, `MPL = ΔQ / ΔL = ${q1 - q0} / ${dl} = ${mp}.`];
            break;
        }
        case 'trh-prace': {
            const mp = val(4, 24), price = val(4, 20) * 10, wage = val(20, 55) * 10;
            labor = { mpl: mp, price, wage };
            prompt = `Při konstantní ceně výrobku ${price} Kč vytvoří dodatečný pracovník ${mp} kusů. Jeho mzdový náklad je ${wage} Kč za stejné období. Vypočti jeho mezní příjem produktu práce MRPL.`;
            answer = mp * price;
            unit = 'Kč';
            hint = 'V modelu dokonale konkurenčního trhu produktu násobíme dodatečný výstup cenou.';
            steps = [`MRPL = MPL × P.`, `MRPL = ${mp} × ${price} = ${answer} Kč.`, `Porovnej tento přínos s mzdovým nákladem ${wage} Kč; otázka požaduje samotné MRPL.`];
            break;
        }
        case 'monopol': {
            const b = val(1, 4), q = val(8, 35), mc = val(5, 45), a = 2 * b * q + mc;
            prompt = `Monopol čelí inverzní poptávce P = ${a} − ${b}Q. Mezní náklady jsou konstantní MC = ${mc}. Urči množství Q maximalizující zisk (předpokládej vnitřní optimum).`;
            answer = q;
            unit = 'kusů';
            hint = 'U lineární inverzní poptávky má MR dvojnásobný sklon než cena. Polož MR = MC.';
            steps = [`Z P = ${a} − ${b}Q plyne MR = ${a} − ${2 * b}Q.`, `V optimu MR = MC: ${a} − ${2 * b}Q = ${mc}.`, `Q = (${a} − ${mc}) / ${2 * b} = ${q} kusů.`];
            break;
        }
        case 'mezni-uzitek': {
            const qty = val(2, 12), mu = val(3, 23), old = val(15, 80), neu = old + mu;
            prompt = `Celkový užitek ze ${qty} kusů je ${old} jednotek, z ${qty + 1} kusů ${neu} jednotek. Jaký je mezní užitek dalšího kusu?`;
            answer = mu;
            unit = 'jednotek užitku';
            hint = 'Podívej se na změnu užitku způsobenou jedním dalším kusem.';
            steps = [`ΔTU = ${neu} − ${old} = ${mu}.`, `ΔQ = 1.`, `MU = ΔTU / ΔQ = ${mu} jednotek užitku.`];
            break;
        }
        case 'soucasna-hodnota': {
            const r = val(2, 12), n = val(1, 4), fv = val(5, 25) * 1000;
            prompt = `Za ${n} rok${n === 1 ? '' : n >= 2 && n <= 4 ? 'y' : 'ů'} obdržíš ${fv} Kč. Diskontní sazba je ${r} % ročně (roční složené úročení). Jaká je dnešní hodnota této částky? Zaokrouhli na 2 desetinná místa.`;
            answer = round2(fv / Math.pow(1 + r / 100, n));
            unit = 'Kč';
            hint = 'Budoucí částku vyděl úročitelem umocněným počtem let.';
            steps = [`PV = FV / (1 + r)^n.`, `PV = ${fv} / (1 + ${r}/100)^${n}.`, `PV = ${cz(answer)} Kč po zaokrouhlení.`];
            break;
        }
        case 'bod-zvratu': {
            const spread = val(5, 30), qty = val(10, 55), v = val(4, 24), p = v + spread, fc = spread * qty;
            prompt = `Firma prodává výrobek za ${p} Kč/kus, variabilní náklady na kus jsou ${v} Kč a fixní náklady ${fc} Kč. Kolik kusů musí prodat, aby dosáhla bodu zvratu?`;
            answer = qty;
            unit = 'kusů';
            hint = 'Příspěvek na úhradu fixních nákladů na kus je cena minus variabilní náklad na kus.';
            steps = [`Příspěvek na úhradu = ${p} − ${v} = ${spread} Kč/kus.`, `Q* = FC / (P − AVC).`, `Q* = ${fc} / ${spread} = ${qty} kusů.`];
            break;
        }
    }
    if (!Number.isFinite(answer) || !steps.length)
        throw new Error('Nevygenerovaná úloha');
    return { id: `${skillId}:${Math.trunc(rng() * 1_000_000_000)}`, skillId, topicId: skill.topicId, title: skill.title, prompt, answer, unit, tolerance: Number.isInteger(answer) ? 1e-8 : 0.005001, steps, hint, market, labor };
}
/** Czech decimal separator accepted; do not interpret units or arbitrary expressions. */
function parseNumericResponse(text) {
    const normalized = text.trim().replace(/[\s\u00a0\u202f]/g, '').replace(',', '.');
    if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(normalized))
        return null;
    const n = Number(normalized);
    return Number.isFinite(n) ? n : null;
}
function gradeCalcProblem(problem, response) {
    const value = parseNumericResponse(response);
    return { valid: value !== null, correct: value !== null && Math.abs(problem.answer - value) <= problem.tolerance, value };
}
function calcSkillProgress(attempts, skillId) {
    const sample = attempts.filter(a => a.skillId === skillId).slice(-8);
    const correct = sample.filter(a => a.correct).length;
    return { attempts: sample.length, correct, accuracy: sample.length ? Math.round(100 * correct / sample.length) : null };
}
function suggestedCalcSkill(attempts, random = Math.random) {
    // Favour unfamiliar skills first, then recent errors. Vary selection across skills.
    const last = attempts.at(-1)?.skillId;
    const scored = CALC_SKILLS.map(skill => {
        const p = calcSkillProgress(attempts, skill.id);
        const recent = attempts.filter(a => a.skillId === skill.id).at(-1);
        return { id: skill.id, weight: (p.attempts === 0 ? 90 : 100 - (p.accuracy ?? 0)) + (recent?.correct === false ? 35 : 0) - (last === skill.id ? 75 : 0) + random() * 5 };
    }).sort((a, b) => b.weight - a.weight);
    return scored[0].id;
}

const DAY_MS = 86_400_000;
function initialState() { return { version: 1, cards: {}, attempts: [], exams: [], diagnostics: [], mathAttempts: [], visitedTopics: [], reviewDays: [], dailyGoal: 8, preference: 'light' }; }

    onClick(event) {

    answer(choice) { const s = this.quiz; if (!s || s.done || s.chosen !== null || choice < 0 || choice > 3)

    onKey(e) {

            e.preventDefault();
            this.submitMathProblem();
            return;
        }
        const el = e.target;
        if (el && (el.matches('input, textarea, select') || el.isContentEditable) || e.ctrlKey || e.metaKey || e.altKey)
            return;
        if ((this.view === 'practice' || this.view === 'exam' || this.view === 'diagnostic') && this.quiz && !this.quiz.done) {
            if (/^[1-4]$/.test(e.key)) {
                e.preventDefault();
                this.answer(Number(e.key) - 1);
            }
            else if (e.key === 'Enter' && this.quiz.chosen !== null) {
                e.preventDefault();
                this.nextQuestion();
            }
        }
        if (this.view === 'review' && this.review && !this.review.done) {
            if (e.code === 'Space' && !this.review.revealed) {
                e.preventDefault();
                this.review.revealed = true;
                this.render();
            }
            else if (this.review.revealed && /^[1-4]$/.test(e.key)) {
                e.preventDefault();
                const names = ['again', 'hard', 'good', 'easy'];
                const btn = document.querySelector(`[data-action="rate"][data-value="${names[Number(e.key) - 1]}"]`);
                btn?.click();
            }
        }

            const term = el.value.toLocaleLowerCase('cs-CZ').trim();
            let visible = 0;
            document.querySelectorAll('.glossary-card').forEach(x => { const show = (x.dataset.search || '').includes(term); x.hidden = !show; if (show)
                visible++; });
            const empty = document.querySelector('#glossaryEmpty');
            if (empty)
                empty.hidden = visible !== 0;
        }
        else if (el.id === 'demandShift' || el.id === 'supplyShift') {
            const n = Math.max(-15, Math.min(15, Number(el.value)));
            if (el.id === 'demandShift')
                this.demandShift = n;
            else
                this.supplyShift = n;
            const visual = document.querySelector('#marketVisual');
            if (visual)
                visual.innerHTML = this.graphSvg();
            const output = document.querySelector('#marketReading');
            if (output)
                output.innerHTML = this.graphReading();
            const number = document.querySelector('#' + el.id + 'Value');
            if (number)
                number.textContent = n > 0 ? '+' + n : String(n);
        }
        else if ((el.id === 'mathDemandShift' || el.id === 'mathMplShift') && this.mathProblem && this.mathResult) {
            const val = Number(el.value);
            if (el.id === 'mathDemandShift')
                this.mathScenarioShift = val;
            else
                this.mathMplDelta = val;
            const graph = document.getElementById('calcVisualPlot');
            if (graph)
                graph.innerHTML = this.mathProblem.market ? marketProblemSvg(this.mathProblem, this.mathScenarioShift) : laborProblemSvg(this.mathProblem, this.mathMplDelta);
            const labels = document.getElementById('calcVisualReading');
            if (labels)
                labels.innerHTML = this.mathProblem.market ? this.marketVisualReading(this.mathProblem, this.mathScenarioShift) : this.laborVisualReading(this.mathProblem, this.mathMplDelta);
            const value = document.getElementById(el.id + 'Value');
            if (value)
                value.textContent = (val > 0 ? '+' : '') + val;
        }
        else if (el.id === 'dailyGoal') {
            const output = document.querySelector('#goalValue');
            if (output)
                output.textContent = `${el.value} karet`;
        }
    }
    async onChange(e) {
        const el = e.target;
        if (el.id === 'mathSkill') {
            const v = el.value;
            this.mathChoice = v === 'adaptive' ? 'adaptive' : CALC_SKILLS.find(s => s.id === v)?.id ?? 'adaptive';
            this.newMathProblem();
            this.render();
            return;
        }
        if (el.id === 'examDate') {
            this.state.examDate = el.value || undefined;
            this.persist();
        }
        if (el.id === 'dailyGoal') {
            this.state.dailyGoal = Math.max(4, Math.min(30, Number(el.value)));
            this.persist();
        }
        if (el.id === 'importFile' && el.files?.[0]) {
            try {
                if (el.files[0].size > 2_000_000)
                    throw new Error('Záloha je příliš velká (max. 2 MB).');
                const text = await el.files[0].text();
                const state = parseBackup(text, this.content);
                if (!window.confirm('Nahraná záloha nahradí aktuální pokrok v tomto prohlížeči. Pokračovat?'))
                    return;
                this.state = state;
                this.persist();
                this.notice = 'Záloha byla obnovena.';
                this.render();
            }
            catch (err) {
                this.notice = err instanceof Error ? err.message : 'Soubor se nepodařilo načíst.';
                this.render();
            }
        }
    }
}
